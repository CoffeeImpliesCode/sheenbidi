# SPDX-License-Identifier: Apache-2.0
# Verification for this fork's Zig package.
#
# This file is written for this repository and names this repository's gates.
# It does not replace or retarget the CI that came with the import:
# `.github/workflows/linux.yml`, `macos.yml` and `windows.yml` and
# `.appveyor.yml` are upstream's, they build upstream's CMake and meson
# projects with upstream's text API enabled, and they upload to upstream's
# Coveralls and AppVeyor accounts. They are left exactly as they arrived.
#
# Five jobs, five different questions:
#   native    does the complete unity core build here in both linkages, do the
#             behavioral tests pass in the two modes where Zig's safety checks
#             are live, does the example produce its output on this host, and
#             does a C program reach the installed library of each kind
#   delivery  does the installed closure come out complete - artifact, all 23
#             public headers, the licence and provenance documents and the
#             eleven Unicode data files - in all four optimize modes, for the
#             static artifact and for the shared one
#   runtime   does the runtime route behave: a call before `load` stops, the
#             same call after a real load succeeds, and a linked build says it
#             has nothing to load
#   cross     does the same graph compile and link for each of the six targets
#             this package claims, with every public facade method instantiated
#   consumer  does the published module resolve from a package that did not
#             write it
#
# Four things this workflow deliberately does not do.
#
# It does not mark any target `continue-on-error`. Nothing here has been
# observed to fail, and pre-labelling a failure as expected is a claim about a
# run that never happened. If a target turns out to be unsupported, the fix is
# to say so in this file with the compiler output that showed it, not to silence
# it.
#
# It does not drop a target out of the cross matrix when `-Dlinkage=dynamic`
# or `-Druntime=true` is asked for. `zig build check` compiles exactly what was
# selected for every one of the six targets, so a target that cannot produce
# what was asked for fails here with its compiler output rather than being
# quietly answered with something else.
#
# It does not exercise `-fsys=sheenbidi`. That mode links an installed
# libSheenBidi, and no packaged SheenBidi is this manifest's pinned 3.0.0 with
# this manifest's headers; installing an arbitrary distro build and translating
# these headers against it is exactly the header/ABI mismatch the fork contract
# forbids. The mode stays available to a user who has installed a matching
# release, and it is documented in `build.zig` and the package documentation.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: native ${{ matrix.linkage }} build, tests and smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two artifact kinds this build graph can produce from this
        # repository's own C. Both are run through the same gates rather than
        # one being called a variant of the other: the export decoration, the
        # file the C program below links and the code the core is compiled with
        # all follow this one option, and only running both says whether they
        # agree.
        linkage: [static, dynamic]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Installs the selected artifact under zig-out/lib (libSheenBidi.a, or
      # libSheenBidi.so with its version and compatibility names), every public
      # header under zig-out/include/SheenBidi/, the licence and provenance
      # documents under zig-out/share/doc/sheenbidi/, the eleven Unicode data
      # files under zig-out/share/doc/sheenbidi/unicode/, and compiles
      # smoke.zig.

      - name: Immutable source and Unicode fixture integrity
        run: sha256sum -c UPSTREAM.sha256
      - name: build
        run: zig build -Dlinkage=${{ matrix.linkage }}

      # Every other step in this job reaches SheenBidi through the Zig
      # facade. This one reaches it the way a C program does: the aggregate
      # public header, the installed library of the selected kind, and no Zig
      # code at all.
      # None of the other steps would notice a facade that is correct while
      # the C surface a C caller compiles against is not, and the fork is a
      # C library first.
      #
      # The expected values are derived from the Unicode Bidirectional
      # Algorithm in the comments inside the program, not read back out of
      # this build, so a wrong answer and a wrong expectation fail it
      # differently.
      - name: installed C headers compile, link and run
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/c_surface_gate.c" <<'C'
          /* The installed SheenBidi C surface, reached the way a C program
             reaches it: the aggregate public header, the installed library of
             the selected kind, and no Zig code at all. Every other step in this
             job reaches the library through the facade, so none of them would
             notice a facade that is correct while the C surface a C caller
             compiles against is not, and the fork is a C library first. */
          #include <SheenBidi/SheenBidi.h>
          #include <stdio.h>

          /* "abc " followed by U+05D0 HEBREW LETTER ALEF and U+05D1 HEBREW
             LETTER BET: eight UTF-8 code units, six code points, two of them
             Hebrew. */
          static const char kText[] = "abc \xd7\x90\xd7\x91";

          #define kCodeUnits ((SBUInteger)(sizeof kText - 1))

          static int gFailures = 0;

          static void expect(int condition, const char *what) {
              if (condition) {
                  printf("ok    %s\n", what);
              } else {
                  printf("FAIL  %s\n", what);
                  gFailures += 1;
              }
          }

          static void expectAt(SBUInteger index, int condition, const char *what) {
              if (condition) {
                  printf("ok    [%lu] %s\n", (unsigned long)index, what);
              } else {
                  printf("FAIL  [%lu] %s\n", (unsigned long)index, what);
                  gFailures += 1;
              }
          }

          int main(void) {
              /* An explicit base level, and the header's "read it off the
                 text" request. Both have to reach the same paragraph, and
                 neither is answered by the caller. */
              static const SBLevel requested[2] = { 0, SBLevelDefaultLTR };
              SBCodepointSequence sequence;
              SBAlgorithmRef algorithm;
              SBParagraphRef paragraph;
              SBParagraphRef keptParagraph;
              SBLineRef line;
              SBLineRef keptLine;
              const SBLevel *levels;
              const SBRun *runs;
              SBUInteger index;
              SBCodepoint codepoint;
              int i;

              sequence.stringEncoding = SBStringEncodingUTF8;
              sequence.stringBuffer = kText;
              sequence.stringLength = kCodeUnits;
              expect(kCodeUnits == 8, "the fixture is eight UTF-8 code units");

              /* The code point surface, walked from the first code unit of
                 the Hebrew pair to the one past the end of the buffer.
                 SBCodepointSequenceGetCodepointAt advances its index to the
                 start of the next code point, so each Hebrew letter moves it
                 by two, and the index sitting at the end is the boundary the
                 header documents as SBCodepointInvalid. */
              index = 4;
              codepoint = SBCodepointSequenceGetCodepointAt(&sequence, &index);
              expect(codepoint == 0x05D0, "code unit 4 is U+05D0 HEBREW ALEF");
              expect(index == 6, "ALEF ends at code unit 6");
              codepoint = SBCodepointSequenceGetCodepointAt(&sequence, &index);
              expect(codepoint == 0x05D1, "code unit 6 is U+05D1 HEBREW BET");
              expect(index == 8, "BET ends at code unit 8");
              codepoint = SBCodepointSequenceGetCodepointAt(&sequence, &index);
              expect(codepoint == SBCodepointInvalid, "code unit 8 is the end");
              expect(index == 8, "a rejected index is left where it was");

              algorithm = SBAlgorithmCreate(&sequence);
              expect(algorithm != NULL, "SBAlgorithmCreate");
              if (algorithm == NULL) {
                  return 1;
              }

              for (i = 0; i < 2; i++) {
                  printf("-- base level request: %s\n",
                         i == 0 ? "0" : "SBLevelDefaultLTR");

                  paragraph = SBAlgorithmCreateParagraph(algorithm, 0, kCodeUnits,
                                                         requested[i]);
                  expect(paragraph != NULL, "SBAlgorithmCreateParagraph");
                  if (paragraph == NULL) {
                      continue;
                  }
                  expect(SBParagraphGetBaseLevel(paragraph) == 0,
                         "the resolved base level is 0");

                  /* Derived from the rules, not read back from this build.
                     Rules P2 and P3 take the leading U+0061 as the first
                     strong character, so the base level is even. The three
                     Latin letters stay at 0, and so does the space: it is a
                     neutral between an L on the left and an R on the right,
                     which rule N1 cannot resolve, so rule N2 gives it the
                     embedding direction. Rules I1 and I2 then raise each
                     Hebrew letter, two code units each, from the even level
                     to the next odd one. */
                  levels = SBParagraphGetLevelsPtr(paragraph);
                  expect(levels != NULL, "SBParagraphGetLevelsPtr");
                  for (index = 0; levels != NULL && index < kCodeUnits; index++) {
                      expectAt(index, levels[index] == (index < 4 ? 0 : 1),
                               "embedding level");
                  }

                  line = SBParagraphCreateLine(paragraph, 0, kCodeUnits);
                  expect(line != NULL, "SBParagraphCreateLine");
                  if (line == NULL) {
                      SBParagraphRelease(paragraph);
                      continue;
                  }
                  expect(SBLineGetRunCount(line) == 2,
                         "the line has two visual runs");

                  /* The run array belongs to the line and is borrowed here,
                     so it is read before the line is released. */
                  runs = SBLineGetRunsPtr(line);
                  expect(runs != NULL, "SBLineGetRunsPtr");
                  for (index = 0; runs != NULL && index < 2; index++) {
                      expectAt(index, runs[index].offset == index * (SBUInteger)4,
                               "run offset");
                      expectAt(index, runs[index].length == 4, "run length");
                      expectAt(index, runs[index].level == (SBLevel)index,
                               "run level");
                  }

                  /* The ownership graph, not a copy: a retained handle keeps
                     the line alive after the handle that created it is
                     released, and the runs it still hands out are the ones
                     the algorithm produced. */
                  keptLine = SBLineRetain(line);
                  expect(keptLine == line, "SBLineRetain returns the same object");
                  SBLineRelease(line);
                  expect(SBLineGetRunCount(keptLine) == 2,
                         "the line outlives the released handle");
                  expect(SBLineGetRunsPtr(keptLine)[1].level == 1,
                         "and its run array is still readable");
                  SBLineRelease(keptLine);
                  SBParagraphRelease(paragraph);
              }

              /* SBAlgorithmCreateParagraph retains the algorithm it is given
                 (Source/API/SBParagraph.c stores that reference in
                 paragraph->_algorithm), so the paragraph is still usable once
                 the caller's algorithm handle is gone. */
              paragraph = SBAlgorithmCreateParagraph(algorithm, 0, kCodeUnits,
                                                     SBLevelDefaultLTR);
              expect(paragraph != NULL, "paragraph for the ownership check");
              keptParagraph = SBParagraphRetain(paragraph);
              expect(keptParagraph == paragraph,
                     "SBParagraphRetain returns the same object");
              SBParagraphRelease(paragraph);
              SBAlgorithmRelease(algorithm);
              expect(SBParagraphGetBaseLevel(keptParagraph) == 0,
                     "the paragraph outlives the released algorithm");
              expect(SBParagraphGetLevelsPtr(keptParagraph)[4] == 1,
                     "and its levels are still readable");
              SBParagraphRelease(keptParagraph);

              if (gFailures != 0) {
                  printf("%d check(s) failed\n", gFailures);
                  return 1;
              }

              printf("the installed C surface compiled, linked and ran\n");
              return 0;
          }
          C
          # The artifact name follows the linkage, and on a shared object the
          # consumer needs to find it at run time as well as at link time. The
          # `libSheenBidi.so` name is the plain compatibility symlink the
          # versioned shared library installs, so `-lSheenBidi` is what a
          # consumer writes; the rpath points at the tree it was installed into.
          #
          # No configuration macro is passed, and on this runner none is needed.
          # The only SB_CONFIG_* the core is built with is SB_CONFIG_UNITY, which
          # turns SB_INTERNAL into `static` for the library build and says
          # nothing about a consumer's view of the headers;
          # Headers/SheenBidi/SBConfig.h ships every macro commented out, so the
          # aggregate a C caller includes is the unconfigured one. The two DLL
          # macros build.zig defines for a dynamic build are read only under
          # _WIN32 (Headers/SheenBidi/SBBase.h:30), and this runner is Linux.
          if [ "${{ matrix.linkage }}" = static ]; then
            library=zig-out/lib/libSheenBidi.a
            extra=
          else
            library=zig-out/lib/libSheenBidi.so
            extra=-Wl,-rpath,"$PWD/zig-out/lib"
          fi
          zig cc \
            -I zig-out/include \
            "$RUNNER_TEMP/c_surface_gate.c" \
            "$library" \
            $extra \
            -o "$RUNNER_TEMP/c_surface_gate"
          "$RUNNER_TEMP/c_surface_gate"

      # One command, both modes: the `test` step builds and runs tests.zig in
      # Debug and in ReleaseSafe itself, so running it twice with -Doptimize
      # would execute the same two binaries again and prove nothing extra.
      - name: test (Debug and ReleaseSafe)
        run: zig build test -Dlinkage=${{ matrix.linkage }}

      - name: smoke
        run: zig build smoke -Dlinkage=${{ matrix.linkage }}

  delivery:
    name: installed closure ${{ matrix.linkage }} ${{ matrix.optimize }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        linkage: [static, dynamic]
        # All four optimize modes, for each artifact kind. The modes change the
        # core's codegen and nothing about the closure, so this job is cheap: it
        # builds, installs, and asserts what landed. It runs no test binary and
        # compiles no C program; the `native` job owns both of those.
        optimize: [Debug, ReleaseSafe, ReleaseFast, ReleaseSmall]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: install into a prefix
        run: >-
          zig build install
          --prefix "$RUNNER_TEMP/prefix"
          -Dlinkage=${{ matrix.linkage }}
          -Doptimize=${{ matrix.optimize }}
          --summary all

      # A licence closure is not a claim in a document, it is files on disk.
      # These assertions fail if any of them is missing, and the counts are
      # exact because NOTICE.md and build.zig both name them exactly: 23 public
      # headers, 10 documents, 11 Unicode data files.
      - name: the installed closure is complete
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/prefix"

          headers=$(find "$prefix/include/SheenBidi" -maxdepth 1 -name '*.h' | wc -l)
          test "$headers" -eq 23 || { echo "expected 23 public headers, found $headers"; exit 1; }
          test -f "$prefix/include/SheenBidi/SheenBidi.h" || { echo "the aggregate header is missing"; exit 1; }

          documents=$(find "$prefix/share/doc/sheenbidi" -maxdepth 1 -type f | wc -l)
          test "$documents" -eq 10 || { echo "expected 10 installed documents, found $documents"; exit 1; }
          for required in LICENSE NOTICE.md FORK-LICENSE.md README.upstream.md UPSTREAM.sha256; do
            test -f "$prefix/share/doc/sheenbidi/$required" || { echo "missing $required"; exit 1; }
          done

          unicode=$(find "$prefix/share/doc/sheenbidi/unicode" -maxdepth 1 -name '*.txt' | wc -l)
          test "$unicode" -eq 11 || { echo "expected 11 Unicode data files, found $unicode"; exit 1; }

          if [ "${{ matrix.linkage }}" = static ]; then
            test -f "$prefix/lib/libSheenBidi.a" || { echo "missing libSheenBidi.a"; exit 1; }
          else
            # The version, the major-version compatibility name, and the plain
            # name `-lSheenBidi` resolves against, which is what upstream's own
            # VERSION/SOVERSION install produces.
            for name in libSheenBidi.so.3.0.0 libSheenBidi.so.3 libSheenBidi.so; do
              test -e "$prefix/lib/$name" || { echo "missing $name"; exit 1; }
            done
            readelf -d "$prefix/lib/libSheenBidi.so.3.0.0" | grep -q 'SONAME.*libSheenBidi\.so\.3'
          fi

          # The installed headers must be the checked-in ones. Nothing in this
          # build edits an upstream header, and this is where that is checked
          # rather than asserted: a header that had gained an SB_CONFIG define
          # would compare unequal.
          diff -r Headers/SheenBidi "$prefix/include/SheenBidi"

  # The runtime route is not a compile-only claim: what it adds is one acquire
  # load and one branch per call, and the only way to see that branch is to make
  # the call before and after a real load. `runtime/misuse.zig` is that
  # observation, and it is built here in the configuration under test.
  #
  # All four cells are exercised, because `-Dlinkage` and `-Druntime` are
  # orthogonal and every pairing is a real configuration. The pairing that
  # needs care is runtime + static: the graph installs a static archive, and the
  # provider it loads is a shared object built elsewhere. That is not a
  # contradiction - "what this build installs" and "what the loader opens" are
  # two different facts - and it does cross the ABI boundary for real: a static
  # archive cannot be the provider in that cell, so the provider is a different
  # binary from the one under test.
  #
  # What these cells do NOT establish, so that no one reads more into them than
  # they say: the provider is built from this same source tree, by this same
  # graph, with this same compiler and these same flags. So they show that a load
  # succeeds against a separately built artifact of this graph, with the layout
  # and scalar checks answering - not that the loader accepts a SheenBidi from
  # another toolchain, a distro package or a different Zig version. That wider
  # case is a driver gate and needs a provider built outside this graph; nothing
  # here produces one, and `runtime/library.zig` says in its own words that
  # resolving symbols proves the file is a SheenBidi of *some* build, not that
  # the scalar widths, the by-pointer layouts and the Unicode revision agree
  # with this one.
  runtime:
    name: runtime=${{ matrix.runtime }} linkage=${{ matrix.linkage }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: false
            linkage: static
          - runtime: false
            linkage: dynamic
          - runtime: true
            linkage: static
          - runtime: true
            linkage: dynamic
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # The provider is a shared object in both runtime cells. In the dynamic
      # cell it is the one this build installs. In the static cell there is none
      # to install, so one is built here into a separate prefix first and the
      # program under test loads that. Building it here rather than checking in
      # a binary is the point: the provider is a second, independent build of
      # this same source tree.
      - name: build a shared provider separately
        if: matrix.runtime && matrix.linkage == 'static'
        run: >-
          zig build install
          --prefix "$RUNNER_TEMP/provider"
          -Dlinkage=dynamic
          --summary all

      - name: build and install the configuration under test
        run: >-
          zig build
          -Druntime=${{ matrix.runtime }}
          -Dlinkage=${{ matrix.linkage }}
          --summary all

      - name: the misuse program is installed
        shell: bash
        run: test -x zig-out/bin/misuse

      # `pre-load` must stop: the dispatch has no table until `load` runs, and
      # saying so is the contract. `after-load` is the control - without it a
      # stop in `pre-load` would be indistinguishable from a build that is
      # broken for some other reason. A linked build has no table at all, so
      # `linked-load` is the stop there.
      - name: the three misuse observations
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          if [ "${{ matrix.runtime }}" = true ]; then
            zig-out/bin/misuse pre-load >pre.txt 2>&1
            status=$?
            if [ "$status" -eq 0 ]; then
              echo "pre-load returned 0; it must stop before any load"; fail=1
            else
              grep -q 'versionString' pre.txt || { echo "pre-load did not name the function"; fail=1; }
            fi
            if [ "${{ matrix.linkage }}" = dynamic ]; then
              provider="$(pwd)/zig-out/lib/libSheenBidi.so"
            else
              provider="$RUNNER_TEMP/provider/lib/libSheenBidi.so"
            fi
            test -e "$provider" || { echo "no shared object to load at $provider"; fail=1; }
            zig-out/bin/misuse after-load "$provider"
          else
            zig-out/bin/misuse linked-load >linked.txt 2>&1
            status=$?
            if [ "$status" -eq 0 ]; then
              echo "linked-load returned 0; a linked build has nothing to load"; fail=1
            else
              grep -q 'not runtime-loaded' linked.txt || { echo "linked-load did not say why"; fail=1; }
            fi
          fi
          exit "$fail"

  cross:
    name: check ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - aarch64-macos-none
          - x86_64-windows-gnu
          - riscv64-linux-gnu
          - wasm32-wasi
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Compile the full library and public API
        run: zig build check -Dtarget=${{ matrix.target }} --summary all

  consumer:
    name: consumer package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The failure this catches is the one the library's own tests cannot see:
      # a module that builds from the inside and does not resolve from outside.
      - name: run
        working-directory: consumer
        run: zig build run
